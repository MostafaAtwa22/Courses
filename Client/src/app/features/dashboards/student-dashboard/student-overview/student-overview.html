<div class="dashboard-page-wrapper">
  <div class="dashboard-main-content">
    <div class="max-width-wrapper p-4">
      <!-- Loading State -->
      <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading your dashboard...</p>
      </div>

      <!-- Dashboard Content -->
      <div *ngIf="!isLoading">
        <app-student-banner (refreshData)="loadStudentData()"></app-student-banner>

        <app-student-statistics [statistics]="statistics"></app-student-statistics>

        <app-continue-learning [recentCourses]="recentCourses"></app-continue-learning>

        <app-recent-transactions [transactions]="transactions"></app-recent-transactions>
      </div>
    </div>
  </div>
</div>
