<div class="analytics-card">
  <div class="card-header d-flex justify-content-between align-items-center mb-3">
    <div>
      <h5 class="card-title">
        <i class="fa-solid fa-graduation-cap text-indigo me-2"></i> Top Course Performance
      </h5>
      <p class="card-subtitle text-muted">Enrollments, Sections & Student Ratings</p>
    </div>
    <button class="btn btn-sm btn-outline-secondary" (click)="viewAllCourses()">View All Courses</button>
  </div>

  <div class="table-responsive">
    <table class="table align-middle custom-table">
      <thead>
        <tr>
          <th>Course Title</th>
          <th>Instructor</th>
          <th>Students</th>
          <th>Sections</th>
          <th>Rating</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of topCourses">
          <td>
            <div class="course-info">
              <span class="course-title">{{ item.title }}</span>
              <span class="course-category">{{ item.category }}</span>
            </div>
          </td>
          <td class="instructor-name">{{ item.instructor }}</td>
          <td>
            <span class="badge students-badge">
              <i class="fa-solid fa-users students-icon me-1"></i> {{ item.enrolledStudents }}
            </span>
          </td>
          <td>
            <span class="badge sections-badge">
              <i class="fa-solid fa-layer-group sections-icon me-1"></i> {{ item.sectionsCount }}
            </span>
          </td>
          <td>
            <span class="rating-badge">
              <i class="fa-solid fa-star rating-icon me-1"></i> {{ item.avgRating }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
