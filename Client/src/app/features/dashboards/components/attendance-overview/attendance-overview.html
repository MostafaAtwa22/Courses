<div class="attendance-card" *ngIf="summary">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="card-title">
      <i class="fa-solid fa-chart-pie text-primary me-2"></i> Attendance Overview
    </h5>
    <span class="badge bg-success-subtle text-success border border-success-subtle">Semester Live</span>
  </div>

  <div class="attendance-hero">
    <div class="circular-metric">
      <span class="percentage">{{ summary.overallPercentage }}%</span>
      <span class="label">Overall Rate</span>
    </div>
    <div class="stats-pills">
      <div class="pill-item present">
        <span class="count">{{ summary.presentCount }}</span>
        <span class="pill-label">Present</span>
      </div>
      <div class="pill-item absent">
        <span class="count">{{ summary.absentCount }}</span>
        <span class="pill-label">Absent</span>
      </div>
      <div class="pill-item late">
        <span class="count">{{ summary.lateCount }}</span>
        <span class="pill-label">Late</span>
      </div>
    </div>
  </div>

  <div class="grade-breakdown mt-3">
    <h6 class="section-subtitle">Breakdown by Grade</h6>
    <div class="grade-row" *ngFor="let item of summary.gradeBreakdown">
      <div class="d-flex justify-content-between mb-1">
        <span class="grade-name">{{ item.grade }}</span>
        <span class="grade-percentage">{{ item.percentage }}%</span>
      </div>
      <div class="progress" style="height: 6px;">
        <div
          class="progress-bar bg-primary"
          role="progressbar"
          [style.width.%]="item.percentage"
        ></div>
      </div>
    </div>
  </div>
</div>
