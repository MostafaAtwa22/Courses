<!-- Admin Top Banner -->
<div class="admin-banner mb-4">
  <div class="banner-content">
    <div class="banner-header">
      <div class="admin-badge">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Admin Console</span>
      </div>
      <h1 class="banner-title">Platform Management</h1>
      <p class="banner-subtitle">Monitor metrics, manage instructor verifications, and oversee course catalogs</p>
    </div>
    <div class="banner-actions">
      <button class="action-btn action-btn--secondary">
        <i class="fa-solid fa-file-export"></i>
        <span>Export Report</span>
      </button>
      <button class="action-btn action-btn--primary" (click)="loadAdminData()">
        <i class="fa-solid fa-arrows-rotate"></i>
        <span>Refresh Data</span>
      </button>
    </div>
  </div>
</div>

<!-- Key Metrics Row -->
<div class="row g-3 mb-4">
  <div class="col-12 col-sm-6 col-xl-3" *ngFor="let metric of roleMetrics">
    <app-stat-card [metric]="metric"></app-stat-card>
  </div>
</div>

<!-- Main Admin Panels Grid -->
<div class="row g-4 mb-4">
  <!-- Full Width Panel: Category Histogram, Enrollment Chart, Pending Instructors & Top Courses -->
  <div class="col-12">
    <div class="d-flex flex-column gap-4">
      <!-- Enrollment Chart and Summary Row -->
      <div class="row g-4">
        <div class="col-12 col-lg-8">
          <app-enrollment-chart-card [enrollmentData]="enrollmentData"></app-enrollment-chart-card>
        </div>
        <div class="col-12 col-lg-4">
          <app-enrollment-summary-table [enrollmentData]="enrollmentData"></app-enrollment-summary-table>
        </div>
      </div>

      <!-- Category Histogram Card -->
      <app-category-histogram-card [categoryData]="categoryHistogramData"></app-category-histogram-card>

      <!-- Pending Instructor Verification Card -->
      <app-pending-instructors-card [pendingInstructors]="pendingInstructors"></app-pending-instructors-card>

      <!-- Top Courses Performance Table -->
      <app-course-analytics [courses]="courses"></app-course-analytics>
    </div>
  </div>
</div>
