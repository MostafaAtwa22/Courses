<div class="admin-card">
  <div class="card-header d-flex justify-content-between align-items-center mb-3">
    <div>
      <h5 class="card-title">
        <i class="fa-solid fa-user-clock text-warning me-2"></i> Pending Instructor Verifications
      </h5>
      <p class="card-subtitle text-muted">Review credentials and approve new instructor accounts</p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-warning text-dark">{{ pendingInstructors.length }} Action Required</span>
      <button 
        class="btn btn-sm btn-outline-primary" 
        (click)="viewAllPending()"
        *ngIf="pendingInstructors.length > 0"
      >
        <i class="fa-solid fa-list me-1"></i> View All Pending
      </button>
    </div>
  </div>

  <div class="verification-list" *ngIf="pendingInstructors.length > 0; else noPending">
    <div class="verification-item" *ngFor="let item of pendingInstructors">
      <img [src]="item.avatar" [alt]="item.name" class="applicant-avatar" />
      <div class="applicant-info">
        <h6 class="applicant-name">{{ item.name }}</h6>
        <span class="applicant-expertise"><i class="fa-solid fa-graduation-cap me-1"></i>{{ item.expertise }}</span>
        <small class="applicant-email text-muted d-block">{{ item.email }} &bull; Applied {{ item.appliedDate }}</small>
      </div>
      <div class="applicant-actions">
        <button class="btn btn-sm btn-success me-2" (click)="approveInstructor(item.id, item.name)">
          <i class="fa-solid fa-check me-1"></i> Approve
        </button>
        <button class="btn btn-sm btn-outline-danger" (click)="rejectInstructor(item.id, item.name)">
          <i class="fa-solid fa-xmark me-1"></i> Decline
        </button>
      </div>
    </div>
  </div>

  <ng-template #noPending>
    <div class="text-center py-4 text-muted">
      <i class="fa-solid fa-circle-check text-success fs-2 mb-2 d-block"></i>
      All instructor verifications are up to date!
    </div>
  </ng-template>
</div>
