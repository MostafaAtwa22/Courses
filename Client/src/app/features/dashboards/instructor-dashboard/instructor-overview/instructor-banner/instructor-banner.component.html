<div class="instructor-banner mb-4">
  <div class="banner-content">
    <div class="banner-header">
      <div class="instructor-badge">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Instructor Dashboard</span>
      </div>
      <h2 class="banner-title">Welcome back!</h2>
      <p class="banner-subtitle">Manage your courses, track student progress, and monitor your teaching performance.</p>
    </div>
    <div class="banner-actions">
      <button class="action-btn action-btn--primary" (click)="onCreateLecture()">
        <i class="fa-solid fa-plus"></i>
        <span>Create Course</span>
      </button>
    </div>
  </div>
</div>
