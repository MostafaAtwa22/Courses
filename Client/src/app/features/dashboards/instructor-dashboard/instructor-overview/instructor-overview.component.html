<!-- Instructor Banner -->
<app-instructor-banner (createLecture)="createNewLecture()"></app-instructor-banner>

<!-- Instructor Stat Cards -->
<app-instructor-stats-cards [metrics]="metrics"></app-instructor-stats-cards>

<!-- Main Grid Split -->
<div class="row g-4 mb-4">
  <!-- Left Panel: Grading Queue & Teaching Schedule -->
  <div class="col-12 col-xl-8">
    <div class="d-flex flex-column gap-4">
      <!-- Student Submissions Grading Feed -->
      <div class="instructor-card">
        <div class="card-header d-flex justify-content-between align-items-center mb-3">
          <div>
            <h5 class="card-title">
              <i class="fa-solid fa-pen-to-square text-indigo me-2"></i> Submissions Awaiting Grading
            </h5>
            <p class="card-subtitle text-muted">Review student work submissions and submit grades</p>
          </div>
          <span class="badge bg-danger">{{ submissions.length }} Pending</span>
        </div>

        <div class="submission-list" *ngIf="submissions.length > 0; else noSubmissions">
          <div class="submission-item" *ngFor="let sub of submissions">
            <div class="submission-info">
              <h6 class="assignment-title">{{ sub.assignmentTitle }}</h6>
              <span class="student-name"><i class="fa-solid fa-user-graduate me-1"></i>{{ sub.studentName }}</span>
              <small class="course-name text-muted d-block">{{ sub.courseTitle }} &bull; Submitted {{ sub.submittedAt }}</small>
            </div>
            <div class="submission-action">
              <button class="btn btn-sm btn-primary" (click)="gradeSubmission(sub.id, sub.studentName)">
                <i class="fa-solid fa-check me-1"></i> Grade & Feedback
              </button>
            </div>
          </div>
        </div>

        <ng-template #noSubmissions>
          <div class="text-center py-4 text-muted">
            <i class="fa-solid fa-circle-check text-success fs-2 mb-2 d-block"></i>
            No pending student submissions to grade right now!
          </div>
        </ng-template>
      </div>

      <!-- Schedule Timeline -->
      <app-schedule-timeline [schedule]="schedule"></app-schedule-timeline>
    </div>
  </div>

  <!-- Right Panel: Activity Log & Feed -->
  <div class="col-12 col-xl-4">
    <app-recent-activity-log [activities]="activities"></app-recent-activity-log>
  </div>
</div>
