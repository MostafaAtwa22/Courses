<app-header [isDarkMode]="isDarkMode" (themeToggled)="toggleTheme()"></app-header>
<div class="settings-container">
  <aside class="settings-sidebar">
    <div class="user-card" *ngIf="currentUser()">
      <div class="user-avatar">
        <img *ngIf="currentUser()?.profilePicture" [src]="currentUser()?.profilePicture" alt="Profile Picture">
        <span *ngIf="!currentUser()?.profilePicture">{{ (currentUser()?.firstName?.charAt(0) || '') + (currentUser()?.lastName?.charAt(0) || '') | uppercase }}</span>
      </div>
      <div class="user-info">
        <div class="user-name">{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</div>
        <div class="user-email">{{ currentUser()?.email }}</div>
        <div class="user-roles">
          <span class="role-badge" *ngFor="let role of currentUser()?.roles" [ngClass]="role.toLowerCase()">{{ role }}</span>
        </div>
      </div>
    </div>

    <div class="nav-section">
      <div class="section-title">ACCOUNT</div>
      <nav class="sidebar-nav">
        <a routerLink="/settings/profile" routerLinkActive="active" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <rect x="7" y="7" width="3" height="3"></rect>
            <rect x="14" y="7" width="3" height="3"></rect>
            <rect x="7" y="14" width="3" height="3"></rect>
            <rect x="14" y="14" width="3" height="3"></rect>
          </svg>
          <span>Overview</span>
          <svg class="arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
      </nav>
    </div>

    <div class="nav-section">
      <div class="section-title">SECURITY</div>
      <nav class="sidebar-nav">
        <a routerLink="/settings/security" routerLinkActive="active" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span>Security Hub</span>
          <svg class="arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
        <a routerLink="/settings/password" routerLinkActive="active" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
          </svg>
          <span>Password</span>
          <svg class="arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
      </nav>
    </div>

    <div class="nav-section">
      <div class="section-title danger-zone">DANGER ZONE</div>
      <nav class="sidebar-nav">
        <a routerLink="/settings/delete-account" routerLinkActive="active" class="nav-link danger">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Delete Account</span>
          <svg class="arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
      </nav>
    </div>

    <div class="sidebar-footer">
      <a routerLink="/" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Back to Home</span>
      </a>
    </div>
  </aside>
  <main class="settings-content">
    <router-outlet></router-outlet>
  </main>
</div>
