<div class="card info-card">
  <div class="card-header">
    <div class="header-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <h2>About</h2>
    </div>
  </div>
  <div class="about-content">
    <div class="about-item" *ngIf="instructorTitle">
      <span class="label">PROFESSIONAL TITLE</span>
      <span class="value">{{ instructorTitle }}</span>
    </div>
    <div class="about-item" *ngIf="instructorBio">
      <span class="label">BIOGRAPHY</span>
      <p class="biography">{{ instructorBio }}</p>
    </div>
  </div>
</div>
