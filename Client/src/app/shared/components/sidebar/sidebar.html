<aside class="dashboard-sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header d-flex align-items-center justify-content-between">
    <div class="brand-icon standalone-icon">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    <div class="brand-info d-flex align-items-center gap-2">
      <div class="brand-icon">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div class="brand-text">
        <span class="brand-title">EduDash</span>
        <span class="role-tag">{{ role | titlecase }}</span>
      </div>
    </div>
    <button class="btn-toggle" (click)="onToggle()" title="Toggle Navigation Sidebar">
      <i [class]="isCollapsed ? 'fa-solid fa-chevron-right' : 'fa-solid fa-chevron-left'"></i>
    </button>
  </div>

  <div class="sidebar-body">
    <nav class="nav-list">
      <ng-container *ngFor="let item of navItems">
        <div *ngIf="item.isSection && !isCollapsed" class="nav-section-label">
          {{ item.label }}
        </div>
        <hr *ngIf="item.isSection && !isCollapsed" class="nav-section-divider">
        <div
          *ngIf="!item.isSection"
          class="nav-link-wrapper"
          [class.disabled]="isNavItemDisabled(item)"
        >
          <a
            [routerLink]="getNavItemRoute(item)"
            routerLinkActive="active"
            class="nav-link-item"
            [class.disabled-link]="isNavItemDisabled(item)"
            [title]="getNavItemTitle(item)"
            [attr.aria-disabled]="isNavItemDisabled(item)"
          >
            <i [class]="item.icon + ' nav-icon'"></i>
            <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
            <span
              *ngIf="shouldShowBadge(item)"
              class="badge nav-badge"
              [ngClass]="item.badgeColor || 'bg-primary'"
            >
            {{ item.badge }}
          </span>
          
          <!-- Verification Guard Overlay for Disabled Items -->
          <div *ngIf="shouldShowGuard(item)" class="verification-guard">
            <i class="fa-solid fa-lock"></i>
            <span>Requires verification</span>
          </div>
          </a>
        </div>
      </ng-container>
    </nav>
  </div>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="onLogout()" [title]="isCollapsed ? 'Sign Out' : ''">
      <i class="fa-solid fa-right-from-bracket logout-icon"></i>
      <span class="logout-label" *ngIf="!isCollapsed">Sign Out</span>
    </button>
  </div>
</aside>
