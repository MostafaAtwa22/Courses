<nav class="navbar" [class.menu-open]="isMenuOpen">
  <div class="container nav-content">
    <div class="logo" routerLink="/">
      <img src="assets/images/logo.png" alt="EduFocus Logo" class="logo-img">
      <span class="logo-text">EduFocus</span>
    </div>

    <!-- Desktop Nav -->
    <div class="nav-links desktop-only">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/courses" routerLinkActive="active">Courses</a>
      <a href="#">About Us</a>
      <a href="#">Contact</a>
    </div>

    <div class="nav-actions">
      <button class="theme-toggle" (click)="onThemeToggle()" [title]="isDarkMode ? 'Light Mode' : 'Dark Mode'">
        <i class="fa-solid" [class.fa-moon]="!isDarkMode" [class.fa-sun]="isDarkMode"></i>
      </button>

      <!-- Wishlist & Cart — visible to guests and students only -->
      <ng-container *ngIf="!authService.currentUser() || authService.currentUser()?.roles?.includes('Student')">
        <button class="icon-action-btn" routerLink="/wishlist" title="Wishlist">
          <i class="fa-regular fa-heart"></i>
        </button>
        <button class="icon-action-btn" routerLink="/cart" title="Cart">
          <i class="fa-solid fa-cart-shopping"></i>
        </button>
      </ng-container>

      <div class="auth-buttons">

        <!-- Guest -->
        <ng-container *ngIf="!authService.currentUser()">
          <div class="desktop-only" style="gap: 12px; align-items: center;">
            <button class="btn-login" routerLink="/auth/login">Log In</button>
            <button class="btn-primary" routerLink="/auth/role-select">Sign Up</button>
          </div>
        </ng-container>

        <!-- Logged in -->
        <ng-container *ngIf="authService.currentUser() as user">
          <div class="user-menu" [class.open]="isDropdownOpen">

            <!-- Avatar trigger -->
            <button class="avatar-btn" (click)="toggleDropdown()" [attr.aria-expanded]="isDropdownOpen" aria-haspopup="true">
              <img [src]="user.profilePicture || (user.gender === 'Female' ? 'assets/users/default-female.png' : 'assets/users/default-male.png')" [alt]="user.firstName" class="avatar-img" />
            </button>

            <!-- Dropdown panel -->
            <div class="dropdown-panel" role="menu">
              <!-- User info header -->
              <div class="dropdown-header">
                <div class="dropdown-avatar">
                  <img [src]="user.profilePicture || (user.gender === 'Female' ? 'assets/users/default-female.png' : 'assets/users/default-male.png')" [alt]="user.firstName" />
                </div>
                <div class="dropdown-user-info">
                  <span class="dropdown-name">{{ user.firstName }} {{ user.lastName }}</span>
                  <span class="dropdown-email">{{ user.email }}</span>
                  <span class="dropdown-role">{{ user.roles[0] }}</span>
                </div>
              </div>

              <div class="dropdown-divider"></div>

              <!-- Nav items -->
              <div class="dropdown-items">
                <a class="dropdown-item" routerLink="/profile" (click)="isDropdownOpen = false" role="menuitem">
                  <i class="fa-regular fa-user"></i>
                  <span>My Profile</span>
                </a>
                <a class="dropdown-item" routerLink="/settings" (click)="isDropdownOpen = false" role="menuitem">
                  <i class="fa-solid fa-gear"></i>
                  <span>Settings</span>
                </a>
                <a class="dropdown-item" routerLink="/courses" (click)="isDropdownOpen = false" role="menuitem" *ngIf="user.roles.includes('Student')">
                  <i class="fa-solid fa-book-open"></i>
                  <span>My Courses</span>
                </a>
              </div>

              <div class="dropdown-divider"></div>

              <!-- Logout -->
              <button class="dropdown-item logout" (click)="logout()" role="menuitem">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Log Out</span>
              </button>
            </div>

          </div>
        </ng-container>
      </div>

      <!-- Mobile Menu Toggle -->
      <button class="menu-toggle mobile-only" (click)="toggleMenu()" aria-label="Toggle Menu">
        <i class="fa-solid" [class.fa-bars]="!isMenuOpen" [class.fa-xmark]="isMenuOpen"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation Overlay -->
  <div class="mobile-menu" [class.active]="isMenuOpen">
    <div class="mobile-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="isMenuOpen = false">Home</a>
      <a routerLink="/courses" routerLinkActive="active" (click)="isMenuOpen = false">Courses</a>
      <a href="#" (click)="isMenuOpen = false">About Us</a>
      <a href="#" (click)="isMenuOpen = false">Contact</a>
    </div>
    <div class="mobile-actions">
      <ng-container *ngIf="!authService.currentUser()">
        <button class="btn-login" routerLink="/auth/login" (click)="isMenuOpen = false">Log In</button>
        <button class="btn-primary" routerLink="/auth/role-select" (click)="isMenuOpen = false">Sign Up</button>
      </ng-container>

    </div>
  </div>
</nav>
